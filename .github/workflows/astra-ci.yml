name: Astra Multi-Runtime CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  verify-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Verify Node.js & HTML Assets
        run: |
          node --check web-dashboard.js
          test -f dashboard.html
      - name: Verify Python Worker Syntax
        run: python3 -m py_compile python_worker.py
      - name: Compile Java 21 SpineLogger
        run: javac SpineLogger.java

  deploy-pages:
    needs: verify-stack
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && cp dashboard.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
