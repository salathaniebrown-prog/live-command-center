name: Astra Multi-Runtime CI
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  verify-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Dashboard & MediaPipe Tasks
        run: |
          python3 -m py_compile dashboard_server.py
          python3 -m py_compile astra-mediapipe-tasks/mediapipe_edge_ml.py
          [ -f python_worker.py ] && python3 -m py_compile python_worker.py || true
          [ -f web-dashboard.js ] && node --check web-dashboard.js || true
          [ -f SpineLogger.java ] && javac SpineLogger.java || true
          echo "=== ASTRA MULTI-RUNTIME & MEDIAPIPE TASKS CI PASSED ==="
