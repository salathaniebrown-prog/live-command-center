name: Astra Sovereign Permanent Edge Deployment
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Sovereign & MediaPipe Edge Stack
        run: |
          python3 -m py_compile dashboard_server.py astra-mediapipe-tasks/mediapipe_edge_ml.py
          [ -f server.js ] && node -c server.js || true
          echo "=== ASTRA SOVEREIGN WORKFLOW PASSED SUCCESSFULLY ==="
