name: Astra Sovereign Permanent Edge Deployment

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Sovereign Repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies & Native SQLite
      run: |
        npm init -y
        npm install express sqlite3
        npm rebuild sqlite3

    - name: Validate Sovereign Server Integrity
      run: |
        node -c server.js
        echo "=== ASTRA SOVEREIGN WORKFLOW PASSED SUCCESSFULLY ==="
