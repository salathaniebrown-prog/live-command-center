name: Eagle Eyes Validate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - crypto/base-usdc-sandbox-20260907
      - "recovery/**"
      - "recover/**"

permissions:
  contents: read

concurrency:
  group: eagle-eyes-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: "production"
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production environment contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EXPO_PUBLIC_EAGLE_EYES_WORLD_DATA_URL: ${{ secrets.EXPO_PUBLIC_EAGLE_EYES_WORLD_DATA_URL }}
        run: |
          echo "Verifying environment variables for Eagle Eyes Data Spine..."
          REQUIRED_VARS=("EXPO_PUBLIC_EAGLE_EYES_WORLD_DATA_URL" "NODE_ENV" "VERCEL_TELEMETRY_DISABLED")
          MISSING_VARS=0

          for VAR in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR}" ]; then
              echo "Error: Required environment variable $VAR is missing or unconfigured."
              MISSING_VARS=$((MISSING_VARS + 1))
            else
              echo "Verified: $VAR is set."
            fi
          done

          if [ "$MISSING_VARS" -gt 0 ]; then
            echo "Pipeline halted: production environment contract is incomplete."
            exit 1
          fi

      - name: Run full Eagle Eyes CI gate
        run: npm run ci

      - name: Check recovered World Data Worker syntax
        run: |
          node --check workers/world-data-edge/worker.mjs
          node --check workers/world-data-v2-legacy-proxy/worker.mjs
          node --check workers/world-data-v2/worker.mjs

      - name: Check recovered bridge syntax
        run: python3 -m py_compile bridges/px4-mavlink-bridge.py

      - name: Check physical-server installer syntax
        run: bash -n deploy/install-systemd.sh

  mobile-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bundle Android JavaScript
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform android --output-dir dist
