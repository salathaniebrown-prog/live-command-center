name: Shell Catcher Validate

on:
  push:
    branches:
      - feature/shell-catcher-live-20260908
  pull_request:
    branches:
      - recovery/complete-eagle-eyes-20260907

permissions:
  contents: read

concurrency:
  group: shell-catcher-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Shell Catcher syntax
        run: |
          node --check shell-catcher.js
          node --check scripts/enable-shell-catcher.js

      - name: Shell Catcher regression suite
        run: node --test test/shell-catcher.test.js

      - name: Full Eagle Eyes recovery gate
        run: npm run ci
