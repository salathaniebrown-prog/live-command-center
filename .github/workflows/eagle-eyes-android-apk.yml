name: Build Eagle Eyes Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "recovery/**"
    paths:
      - "clients/mobile/**"
      - ".github/workflows/eagle-eyes-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_EAGLE_EYES_WORLD_DATA_URL: "https://eagle-eyes-world-data-v2.salathaniebrown.chatgpt.site"
    defaults:
      run:
        working-directory: clients/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK
        working-directory: clients/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Eagle Eyes standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Eagle-Eyes-Android-Standalone
          path: clients/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
