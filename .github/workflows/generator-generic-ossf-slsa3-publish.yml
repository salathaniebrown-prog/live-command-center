 Live Command Center CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-command-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Node.js application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "ERROR: package.json was not found."
            exit 1
          fi

      - name: Check server.js syntax
        run: |
          if [ -f server.js ]; then
            node --check server.js
          else
            echo "ERROR: server.js was not found."
            exit 1
          fi

      - name: Run tests
        run: npm test --if-present

      - name: Verify application
        run: |
          test -f package.json
          test -f server.js
          echo "Live Command Center validation passed."