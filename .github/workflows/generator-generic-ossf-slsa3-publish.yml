name: Live Command Center CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-command-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Node.js application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check server.js

      - name: Run tests
        run: npm test --if-present

      - name: Verify required files
        run: |
          test -f package.json
          test -f server.js
          test -f public/index.html
          echo "Live Command Center validation passed."
