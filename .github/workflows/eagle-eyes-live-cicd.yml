name: Eagle Eyes Live CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: eagle-eyes-production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-test:
    name: Validate Eagle Eyes V13
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ci
  verify-railway:
    name: Verify Railway Production Revision
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify GitHub-connected Railway deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/verify-deployed-revision.py --url https://live-command-center-production-31ed.up.railway.app --sha "$EXPECTED_SHA"
