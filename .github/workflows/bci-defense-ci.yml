name: BCI Defense CI

on:
  push:
    paths:
      - "bci_defense_project/**"
      - ".github/workflows/bci-defense-ci.yml"
  pull_request:
    paths:
      - "bci_defense_project/**"
      - ".github/workflows/bci-defense-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bci_defense_project

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -v
