name: Satellite Recovery Validation

on:
  pull_request:
    paths:
      - "satellites.js"
      - "server.js"
      - "public/index.html"
      - "package.json"
      - "test/satellites.test.js"
      - ".github/workflows/satellite-recovery-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run Eagle Eyes checks
        run: npm run check

      - name: Verify full live-data recovery limits
        run: |
          grep -Fq 'const MAX_SATELLITES = 512;' satellites.js
          grep -Fq '/api/eagle-eyes/satellites?limit=120' public/index.html
          grep -Fq 'source=nws&limit=50' public/index.html
          grep -Fq 'source=usgs&limit=50' public/index.html
          grep -Fq 'source=eonet&limit=50' public/index.html
          echo 'Full live-data recovery verified: satellites 512 backend / 120 dashboard; NWS/USGS/EONET 50 each.'
