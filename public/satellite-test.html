<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#060706" />
  <title>Eagle Eyes • Satellite Basemap Test</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    html, body { height: 100%; margin: 0; background: #060706; color: #f7f1e7; font-family: system-ui, sans-serif; }
    #map { position: fixed; inset: 0; }
    .hud {
      position: fixed; z-index: 1000; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top));
      background: rgba(7,7,6,.88); border: 1px solid rgba(242,198,109,.35); border-radius: 14px;
      padding: 12px; backdrop-filter: blur(10px); box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .title { color: #f2c66d; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 750; }
    .row { display: flex; gap: 8px; margin-top: 9px; }
    input { flex: 1; min-width: 0; border: 1px solid rgba(242,198,109,.28); border-radius: 10px; background: #11110f; color: #fff; padding: 10px; }
    button { border: 1px solid #f2c66d; border-radius: 10px; background: #f2c66d; color: #171208; font-weight: 750; padding: 10px 12px; }
    .status { margin-top: 8px; color: #b8b1a5; font-size: 11px; line-height: 1.35; }
  </style>
</head>
<body>
  <div id="map" aria-label="Eagle Eyes satellite basemap test"></div>
  <div class="hud">
    <div class="title">Eagle Eyes • Satellite Basemap Recovery Test</div>
    <div class="row">
      <input id="token" type="password" autocomplete="off" placeholder="Paste Mapbox public pk.* token" />
      <button id="load">Load</button>
    </div>
    <div class="status" id="status">Isolated recovery page. No production files are modified. Token stays in this browser session only.</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map', { worldCopyJump: true, zoomControl: true }).setView([34.05, -118.25], 3);
    let satelliteLayer = null;

    function loadSatellite() {
      const token = document.getElementById('token').value.trim();
      const status = document.getElementById('status');
      if (!token.startsWith('pk.')) {
        status.textContent = 'Use a Mapbox public token beginning with pk.*. Do not paste an sk.* secret token here.';
        return;
      }
      sessionStorage.setItem('eagleEyesMapboxPublicToken', token);
      if (satelliteLayer) map.removeLayer(satelliteLayer);
      satelliteLayer = L.tileLayer(
        'https://api.mapbox.com/v4/mapbox.satellite/{z}/{x}/{y}@2x.jpg90?access_token=' + encodeURIComponent(token),
        { maxZoom: 20, tileSize: 256, attribution: '© Mapbox © OpenStreetMap' }
      ).addTo(map);
      satelliteLayer.once('load', () => { status.textContent = 'SATELLITE BASEMAP ONLINE • pan and zoom to validate touch interaction.'; });
      satelliteLayer.on('tileerror', () => { status.textContent = 'Tile request failed. Check the public token, token restrictions, and network access.'; });
    }

    document.getElementById('load').addEventListener('click', loadSatellite);
    const saved = sessionStorage.getItem('eagleEyesMapboxPublicToken');
    if (saved) {
      document.getElementById('token').value = saved;
      loadSatellite();
    }
  </script>
</body>
</html>
