<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Command Center</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      color: #00ff88;
      overflow: hidden;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 20px;
      padding: 20px;
      height: 100vh;
    }
    .card {
      background: rgba(10, 14, 39, 0.8);
      border: 2px solid #00ff88;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }
    h2 {
      margin-bottom: 15px;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 2px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
    }
    .metric-label { font-size: 12px; text-transform: uppercase; }
    .metric-value {
      font-size: 24px;
      font-weight: bold;
      color: #00ff88;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid #00ff88;
      border-radius: 4px;
      margin: 8px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #00cc6a);
      width: 0%;
      transition: width 0.3s ease;
    }
    .status-online { color: #00ff88; }
    .status-offline { color: #ff0055; }
    .workload-list {
      list-style: none;
      font-size: 12px;
    }
    .workload-item {
      padding: 5px 0;
      padding-left: 10px;
      border-left: 2px solid #00ff88;
      margin: 5px 0;
    }
    .header {
      grid-column: 1 / -1;
      text-align: center;
      padding: 20px;
      border-bottom: 2px solid #00ff88;
    }
    .header h1 {
      font-size: 32px;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 5px;
    }
    .timestamp {
      font-size: 11px;
      color: #00aa66;
    }
    .error { color: #ff0055; font-size: 11px; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚡ COMMAND CENTER</h1>
      <p class="timestamp" id="time"></p>
    </div>

    <div class="card">
      <h2>System Status</h2>
      <div class="metric-row">
        <span class="metric-label">System Online</span>
        <span class="metric-value" id="status-online">—</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">System Status</span>
        <span class="metric-value" id="status-value">—</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Mode</span>
        <span style="font-size: 12px;" id="status-mode">—</span>
      </div>
      <div class="error" id="status-error"></div>
    </div>

    <div class="card">
      <h2>System Metrics</h2>
      <div class="metric-row">
        <span class="metric-label">CPU</span>
        <span class="metric-value" id="cpu-value">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="cpu-bar"></div></div>
      <div class="metric-row">
        <span class="metric-label">GPU</span>
        <span class="metric-value" id="gpu-value">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="gpu-bar"></div></div>
      <div class="metric-row">
        <span class="metric-label">Memory</span>
        <span class="metric-value" id="mem-value">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="mem-bar"></div></div>
      <div class="metric-row">
        <span class="metric-label">Storage</span>
        <span class="metric-value" id="storage-value">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="storage-bar"></div></div>
      <div class="metric-row">
        <span class="metric-label">Temperature</span>
        <span class="metric-value" id="temp-value">—</span>
      </div>
      <div class="error" id="metrics-error"></div>
    </div>

    <div class="card">
      <h2>Deployment Status</h2>
      <div class="metric-row">
        <span class="metric-label">Progress</span>
        <span class="metric-value" id="deploy-progress">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="deploy-bar"></div></div>
      <div class="metric-row">
        <span class="metric-label">Stage</span>
        <span class="metric-value" id="deploy-stage">—</span>
      </div>
      <div class="metric-row">
        <span class="metric-label">Success</span>
        <span class="metric-value" id="deploy-success">—</span>
      </div>
      <div class="error" id="deploy-error"></div>
    </div>

    <div class="card">
      <h2>Active Workloads</h2>
      <ul class="workload-list" id="workload-list"></ul>
      <div class="error" id="workload-error"></div>
    </div>

    <div class="card">
      <h2>System Health</h2>
      <div class="metric-row">
        <span class="metric-label">API Health</span>
        <span class="metric-value" id="health-status">—</span>
      </div>
      <div class="metric-row" style="font-size: 11px;">
        <span id="health-time">—</span>
      </div>
      <div class="error" id="health-error"></div>
    </div>
  </div>

  <script>
    async function fetchData() {
      // Status
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('status-online').textContent = data.online ? '✓ ONLINE' : '✗ OFFLINE';
        document.getElementById('status-online').className = data.online ? 'metric-value status-online' : 'metric-value status-offline';
        document.getElementById('status-value').textContent = data.systemStatus || '—';
        document.getElementById('status-mode').textContent = data.mode || '—';
        document.getElementById('status-error').textContent = data.upstreamError ? `⚠ ${data.upstreamError}` : '';
      } catch (e) {
        document.getElementById('status-error').textContent = '✗ Failed to fetch status';
      }

      // Metrics
      try {
        const res = await fetch('/api/metrics');
        const data = await res.json();
        const update = (id, value) => {
          document.getElementById(id).textContent = value + '%';
          document.getElementById(id.replace('-value', '-bar')).style.width = value + '%';
        };
        update('cpu-value', data.cpu);
        update('gpu-value', data.gpu);
        update('mem-value', data.memory);
        update('storage-value', data.storage);
        document.getElementById('temp-value').textContent = data.temperatureC + '°C';
        document.getElementById('metrics-error').textContent = data.upstreamError ? `⚠ ${data.upstreamError}` : '';
      } catch (e) {
        document.getElementById('metrics-error').textContent = '✗ Failed to fetch metrics';
      }

      // Workloads
      try {
        const res = await fetch('/api/workloads');
        const data = await res.json();
        const list = document.getElementById('workload-list');
        list.innerHTML = data.map(w => `<li class="workload-item">▶ ${w}</li>`).join('');
        document.getElementById('workload-error').textContent = data.upstreamError ? `⚠ ${data.upstreamError}` : '';
      } catch (e) {
        document.getElementById('workload-error').textContent = '✗ Failed to fetch workloads';
      }

      // Deployment
      try {
        const res = await fetch('/api/deployment');
        const data = await res.json();
        document.getElementById('deploy-progress').textContent = data.progress + '%';
        document.getElementById('deploy-bar').style.width = data.progress + '%';
        document.getElementById('deploy-stage').textContent = data.stage || '—';
        document.getElementById('deploy-success').textContent = data.success ? '✓ SUCCESS' : '✗ FAILED';
        document.getElementById('deploy-success').style.color = data.success ? '#00ff88' : '#ff0055';
        document.getElementById('deploy-error').textContent = data.upstreamError ? `⚠ ${data.upstreamError}` : '';
      } catch (e) {
        document.getElementById('deploy-error').textContent = '✗ Failed to fetch deployment';
      }

      // Health
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        document.getElementById('health-status').textContent = data.ok ? '✓ HEALTHY' : '✗ UNHEALTHY';
        document.getElementById('health-time').textContent = new Date(data.time).toLocaleString();
        document.getElementById('health-error').textContent = '';
      } catch (e) {
        document.getElementById('health-error').textContent = '✗ Failed to fetch health';
      }

      // Time
      document.getElementById('time').textContent = new Date().toLocaleString();
    }

    // Initial fetch and then every 2 seconds
    fetchData();
    setInterval(fetchData, 2000);
  </script>
</body>
</html>
