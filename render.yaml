services:
  - type: web
    name: eagle-eyes-global
    runtime: static
    buildCommand: node scripts/verify-global-static.js
    staticPublishPath: public
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://live-command-center-deployment.onrender.com/api/*
      - type: rewrite
        source: /chat
        destination: /tri-chat.html
      - type: rewrite
        source: /chat/
        destination: /tri-chat.html
      - type: rewrite
        source: /*
        destination: /index.html
